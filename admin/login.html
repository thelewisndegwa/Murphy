<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login | Murphy Merchants</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="icon" type="image/png" href="/assets/images/logo.png">
</head>
<body class="admin-body">
  <main class="admin-login">
    <h1>Admin login</h1>
    <p>Murphy Merchants Auctioneers</p>
    <form class="admin-form" id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit" class="btn btn--navy" style="width:100%">Sign in</button>
      <p class="admin-msg" id="login-msg" role="status"></p>
    </form>
  </main>
  <script>
(function () {
  fetch('/api/admin/me', { credentials: 'same-origin' })
    .then(function (r) { if (r.ok) window.location.href = '/admin/index.html'; })
    .catch(function () {});

  var form = document.getElementById('login-form');
  var msg = document.getElementById('login-msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'admin-msg';
    msg.textContent = '';
    fetch('/api/admin/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) {
          msg.className = 'admin-msg is-error';
          msg.textContent = res.d.error || 'Login failed';
          return;
        }
        window.location.href = '/admin/index.html';
      })
      .catch(function () {
        msg.className = 'admin-msg is-error';
        msg.textContent = 'Could not reach server';
      });
  });
})();
  </script>
</body>
</html>
